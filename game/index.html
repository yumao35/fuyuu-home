<style>
  :root {
    --ink: #241d18;
    --ink-soft: #5a4f45;

    --paper-lift: #fff8eb;
    --paper-deep: #ece0c6;

  body {

  .wrap { width: 100%; max-width: 900px; margin: 0 auto; }
  .top {
    display: flex; align-items: baseline; justify-content: space-between;

  .top a { color: var(--ink-soft); text-decoration: none; border-bottom: 1.5px solid transparent; }
  .top a:hover, .top a:focus-visible { color: var(--ink); border-bottom-color: var(--ink); }
  .back { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  .top nav { display: flex; gap: 18px; }
  .label {
    display: flex; align-items: center; gap: 10px;
    margin: 0 4px 14px; font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(36,29,24,.22), rgba(36,29,24,0)); }
  .card {
    background: var(--paper-lift);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-ink);
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  }
  /* ---- 封面画廊：单张封面换成可滑动的多图画廊 ----
     用原生 scroll-snap 做横向滑动：手指划、触控板、鼠标拖都由浏览器处理，
     不引入任何库，也不会跟门牌页的预取脚本抢主线程。 */
  .shot { position: relative; background: var(--paper-deep); min-height: 240px; overflow: hidden; }
  .carousel-track {
    position: absolute; inset: 0;
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  .slide {
    position: relative; flex: 0 0 100%; height: 100%; margin: 0;
    scroll-snap-align: start; scroll-snap-stop: always;
    background: var(--paper-deep);
  }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; }
  .shot::after {
    content: ""; position: absolute; inset: 0; z-index: 2;
    box-shadow: inset 0 0 0 1px rgba(36,29,24,.10); pointer-events: none;

  .slide-tag {
    position: absolute; right: 12px; top: 12px; z-index: 3;
    padding: 3px 11px; border: 1.5px solid var(--ink); border-radius: 999px;
    background: rgba(255,248,235,.9); color: var(--ink);
    font-size: 11px; letter-spacing: .1em; white-space: nowrap; pointer-events: none;
  }
  .carousel-arrow {
    position: absolute; top: 50%; z-index: 4; transform: translateY(-50%);
    width: 34px; height: 34px; padding: 0; display: grid; place-items: center;
    border: 2px solid var(--ink); border-radius: 999px;
    background: rgba(255,248,235,.92); color: var(--ink);
    font: 700 19px/1 var(--sans); cursor: pointer;
    opacity: 0; transition: opacity .18s ease, background .18s ease;
  }
  .carousel-arrow.prev { left: 10px; }
  .carousel-arrow.next { right: 10px; }
  .carousel:hover .carousel-arrow, .carousel-arrow:focus-visible { opacity: 1; }
  .carousel-arrow:hover { background: var(--butter); }
  .carousel-arrow:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 3px; }
  .carousel-dots {
    position: absolute; left: 0; right: 0; bottom: 11px; z-index: 4;
    display: flex; justify-content: center; gap: 7px; pointer-events: none;
  }
  .carousel-dots button {
    pointer-events: auto; width: 9px; height: 9px; padding: 0;
    border: 1.5px solid var(--ink); border-radius: 999px;
    background: rgba(255,248,235,.65); cursor: pointer;
    transition: width .2s ease, background .2s ease;
  }
  .carousel-dots button[aria-selected="true"] { width: 22px; background: var(--ink); }
  .carousel-dots button:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 3px; }
  /* 触屏靠手指划，不需要左右箭头占位 */
  @media (hover: none) { .carousel-arrow { display: none; } }
  .body { padding: 28px 28px 26px; display: flex; flex-direction: column; }
  .kicker { font-size: 11px; letter-spacing: .2em; color: var(--sea-deep); text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-family: var(--serif); font-size: clamp(32px, 4.6vw, 46px); line-height: 1.15; margin: 0 0 12px; letter-spacing: .02em; }
  .desc { margin: 0 0 16px; font-size: 15px; color: var(--ink-soft); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .tags li { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #fffdf5; border: 1px solid rgba(36,29,24,.22); color: var(--ink-soft); }
  .meta { font-size: 12.5px; color: var(--ink-soft); line-height: 1.9; margin: 0 0 22px; }

  .enter {

    background: var(--ink); color: var(--paper-lift); text-decoration: none;

  .enter:hover, .enter:focus-visible { background: var(--butter); color: var(--ink); transform: translate(-2px, -2px); }
  .enter:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 4px; }
  .enter .arrow { transition: transform .18s ease; }
  .enter:hover .arrow { transform: translateX(4px); }
  footer {

  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(36,29,24,.25); }
  @media (max-width: 780px) {
    body { padding: 0 14px 40px; }
    .top { padding: 24px 2px 20px; }
    .card { grid-template-columns: 1fr; }
    .shot { min-height: 0; aspect-ratio: 16 / 9; }
    .body { padding: 20px 18px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .enter:hover { transform: none; }
    .carousel-track { scroll-behavior: auto !important; }
  }
</style>

<body>

<script>
/* prefetch 优先级很低，个别浏览器会拖到很晚才发。玩家在这一页通常只停两三秒，
   首屏出来之后再补一次显式预取；已经命中缓存就不会重复下载。 */
(function () {
  function warm() {
    try {
      fetch("https://game.fuyuu.top/", { mode: "no-cors", credentials: "omit" }).catch(function () {});
    } catch (error) { /* 预取失败也不影响跳转 */ }
  }
  if (document.readyState === "complete") window.setTimeout(warm, 900);
  else window.addEventListener("load", function () { window.setTimeout(warm, 900); });
})();

/* 「更新」日期由发布脚本在每次推送时写进 HTML（见 tools/publish.py）。
   这里再补一层：延迟 2 秒去读游戏仓库最后一次提交时间，成功就把日期精确成
   「年-月-日 时:分」。请求失败、超时、限流都静默保留脚本写好的日期 ——
   门牌页首要任务是预热游戏首页，这个可有可无的查询绝不能抢它的带宽。 */
(function () {
  var el = document.getElementById("lastUpdated");
  if (!el || !window.fetch || !window.Promise) return;
  var url = "https://api.github.com/repos/yumao35/yumao35.github.io/commits/main";
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function load() {
    try {
      var timer;
      var timeout = new Promise(function (_, reject) {
        timer = window.setTimeout(function () { reject(new Error("timeout")); }, 4000);
      });
      var request = fetch(url, { headers: { Accept: "application/vnd.github+json" }, credentials: "omit" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (j) {
          var iso = j && j.commit && j.commit.committer && j.commit.committer.date;
          if (!iso) throw new Error("no date");
          var d = new Date(iso);
          if (isNaN(d.getTime())) throw new Error("bad date");
          /* GitHub 给的是 UTC；用 +8h 再按 UTC 分量读，避免依赖旧内核的时区数据库 */
          var bj = new Date(d.getTime() + 8 * 3600 * 1000);
          var full = bj.getUTCFullYear() + "-" + pad(bj.getUTCMonth() + 1) + "-" +
            pad(bj.getUTCDate()) + " " + pad(bj.getUTCHours()) + ":" + pad(bj.getUTCMinutes());
          /* 静态日期是发布脚本在「本次推送」时写下的，可能比游戏仓库的最后提交
             还新（例如只改了门牌页文案）。只在提交时间不早于它时才用更精确的值覆盖，
             否则保留静态日期 —— 两边取较晚的那个，永远不会显示倒退的日期。 */
          var fallback = el.textContent.trim();
          if (full.slice(0, 10) >= fallback) el.textContent = full;
        });
      Promise.race([request, timeout])
        .catch(function () { /* 静态日期已由发布脚本写好，这里不做任何补救 */ })
        .then(function () { window.clearTimeout(timer); });
    } catch (error) { /* 老内核不支持 Promise.race / fetch 时同样静默 */ }
  }
  if (document.readyState === "complete") window.setTimeout(load, 2000);
  else window.addEventListener("load", function () { window.setTimeout(load, 2000); });
})();

/* 封面画廊：滑动本身交给 CSS scroll-snap，这里只补自动翻页、圆点、箭头和键盘。
   注意别让这几张图抢带宽 —— 门牌页的首要任务是把游戏首页预热进缓存。 */
(function () {
  const root = document.getElementById("shotCarousel");
  const track = document.getElementById("carouselTrack");
  if (!root || !track) return;
  const slides = Array.from(track.querySelectorAll(".slide"));
  const dots = Array.from(root.querySelectorAll(".carousel-dots button"));
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let index = 0, dir = 1, pauseUntil = 0, raf = 0;

  function paint(i) {
    index = (i + slides.length) % slides.length;
    dots.forEach(function (d, k) {
      d.setAttribute("aria-selected", k === index ? "true" : "false");
    });
  }
  function go(i) {
    paint(i);
    /* behavior:"auto" 会沿用 CSS 的 scroll-behavior：正常平滑、reduced-motion 瞬间 */
    track.scrollTo({ left: index * track.clientWidth, behavior: "auto" });
  }
  function jump(i) {
    paint(i);
    const prev = track.style.scrollBehavior;
    track.style.scrollBehavior = "auto";
    track.scrollLeft = index * track.clientWidth;
    track.style.scrollBehavior = prev;
  }
  /* 手指划过之后，圆点要跟着当前停留的那张走 */
  track.addEventListener("scroll", function () {
    window.cancelAnimationFrame(raf);
    raf = window.requestAnimationFrame(function () {
      const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      if (i !== index) paint(i);
    });
  }, { passive: true });

  function pause() { pauseUntil = Date.now() + 9000; }
  ["pointerdown", "touchstart", "wheel", "keydown"].forEach(function (name) {
    track.addEventListener(name, pause, { passive: true });
  });
  dots.forEach(function (d, i) {
    d.addEventListener("click", function () { pause(); go(i); });
  });
  document.getElementById("shotPrev").addEventListener("click", function () { pause(); go(index - 1); });
  document.getElementById("shotNext").addEventListener("click", function () { pause(); go(index + 1); });
  root.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft")  { e.preventDefault(); pause(); go(index - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); pause(); go(index + 1); }
  });
  window.addEventListener("resize", function () { jump(index); });

  /* 来回翻而不是「到最后一张倒带回首张」，视觉上更连贯 */
  if (!reduce) {
    window.setInterval(function () {
      if (document.hidden || Date.now() < pauseUntil) return;
      let next = index + dir;
      if (next >= slides.length) { dir = -1; next = index - 1; }
      else if (next < 0) { dir = 1; next = index + 1; }
      go(next);
    }, 5000);
  }
  /* 首图随 HTML 立刻加载；其余等预热发出后再拉，滑动到时不会出现空白 */
  window.setTimeout(function () {
    slides.forEach(function (s, i) {
      if (!i) return;
      const img = s.querySelector("img[data-src]");
      if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); }
    });
  }, 1400);
})();
</script>
