<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fuyuu · 小岛与手工感的交互</title>
<meta name="description" content="fuyuu 的作品大厅：一座叫《苔屿》的网页小岛，钓鱼、弦歌搏斗、种菜、和邻居打交道。">
<meta name="theme-color" content="#f6efdd">
<meta property="og:type" content="website">
<meta property="og:title" content="fuyuu · 小岛与手工感的交互">
<meta property="og:description" content="一座会呼吸的小岛，和一点点手工感。">
<meta property="og:image" content="./cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff8eb'/%3E%3Cpath d='M6 20c2-6 6-9 10-9s8 3 10 9c-3 3-6 4-10 4s-7-1-10-4z' fill='%2378b6a8'/%3E%3Ccircle cx='16' cy='15' r='3.4' fill='%235f7f6a'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #241d18;
    --ink-soft: #5a4f45;
    --paper: #f6efdd;
    --paper-lift: #fff8eb;
    --paper-deep: #ece0c6;
    --butter: #ffe27a;
    --sea: #78b6a8;
    --sea-deep: #3f7c72;
    --coral: #e08a72;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --radius: 18px;
    --shadow-ink: 3px 3px 0 rgba(36, 29, 24, .82);
    --shadow-soft: 0 12px 30px rgba(36, 29, 24, .10);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 56px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.65;
    overflow-wrap: break-word;
    background-color: var(--paper);
    background-image:
      radial-gradient(120% 80% at 12% -10%, #fffdf5 0%, rgba(255, 253, 245, 0) 55%),
      radial-gradient(90% 60% at 100% 0%, #f0f7f2 0%, rgba(240, 247, 242, 0) 60%),
      radial-gradient(70% 50% at 50% 110%, #efe3c9 0%, rgba(239, 227, 201, 0) 70%);
    background-attachment: fixed;
  }

  .wrap { width: 100%; max-width: 1060px; margin: 0 auto; }

  /* ---------- header ---------- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 34px 4px 26px;
  }

  .mark {
    font-family: var(--serif);
    font-size: clamp(30px, 5.4vw, 44px);
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1;
    margin: 0;
  }

  .mark span { color: var(--sea-deep); }

  .top nav {
    display: flex;
    gap: 18px;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--ink-soft);
  }

  .top nav a {
    color: inherit;
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
    transition: border-color .18s ease, color .18s ease;
  }

  .top nav a:hover,
  .top nav a:focus-visible { color: var(--ink); border-bottom-color: var(--ink); }

  /* ---------- hero line ---------- */
  .lede {
    font-family: var(--serif);
    font-size: clamp(19px, 2.6vw, 26px);
    line-height: 1.5;
    margin: 0 4px 34px;
    max-width: 22em;
    color: var(--ink);
  }

  .lede em { font-style: normal; background: linear-gradient(transparent 62%, var(--butter) 62%); }

  /* ---------- section label ---------- */
  .label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 4px 14px;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(36, 29, 24, .22), rgba(36, 29, 24, 0));
  }

  /* ---------- featured card ---------- */
  .featured {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 0;
    text-decoration: none;
    color: inherit;
    background: var(--paper-lift);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-ink);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .featured:hover,
  .featured:focus-visible {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 rgba(36, 29, 24, .82);
  }

  .featured:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 4px; }

  .shot {
    position: relative;
    background: var(--paper-deep);
    min-height: 200px;
    overflow: hidden;
  }

  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 46%;
  }

  .shot::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(36, 29, 24, .10);
    pointer-events: none;
  }

  .body { padding: 30px 30px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }

  .kicker {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--sea-deep);
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .featured h2 {
    font-family: var(--serif);
    font-size: clamp(30px, 4vw, 42px);
    line-height: 1.15;
    margin: 0;
    letter-spacing: .03em;
  }

  .featured p {
    margin: 0 0 18px;
    font-size: 14.5px;
    color: var(--ink-soft);
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
  }

  .tags li {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #fffdf5;
    border: 1px solid rgba(36, 29, 24, .22);
    color: var(--ink-soft);
  }

  .update {
    margin: -10px 0 20px;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .update a { color: var(--sea-deep); }

  .enter {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper-lift);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .08em;
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(36, 29, 24, .22);
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }

  .enter:hover,
  .enter:focus-visible { background: var(--butter); color: var(--ink); }
  .enter:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 4px; }

  .enter .arrow { transition: transform .18s ease; }

  .featured:hover .enter { background: var(--butter); color: var(--ink); }
  .featured:hover .enter .arrow { transform: translateX(4px); }

  /* ---------- about ---------- */
  .about {
    margin-top: 46px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 28px;
    border-top: 1px solid rgba(36, 29, 24, .18);
    padding-top: 26px;
  }

  .about h2 {
    font-family: var(--serif);
    font-size: 21px;
    margin: 0 0 10px;
  }

  .about p {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 30em;
  }

  .about .meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 2;
    margin: 0;
  }

  .about .meta b {
    display: inline-block;
    min-width: 5.2em;
    color: var(--ink);
    font-weight: 600;
  }

  .about .meta a { word-break: break-all; }

  footer {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid rgba(36, 29, 24, .18);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: rgba(90, 79, 69, .85);
  }

  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(36, 29, 24, .25); }

  @media (max-width: 780px) {
    body { padding: 0 14px 40px; }
    .top { padding: 26px 2px 20px; }
    .featured { grid-template-columns: 1fr; }
    .shot { min-height: 0; aspect-ratio: 16 / 9; }
    .body { padding: 20px 18px 20px; }
    .about { grid-template-columns: 1fr; gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .featured:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 class="mark">fuyuu<span>.</span></h1>
    <nav>
      <a href="#works">作品</a>
      <a href="#about">关于</a>
      <a href="./game/">进岛</a>
    </nav>
  </header>

  <p class="lede">一座会呼吸的岛，和一些<em>手工感</em>的交互。</p>

  <section id="works" aria-labelledby="works-label">
    <p class="label" id="works-label">作品 / WORK</p>

    <!-- 大厅只做「封面 + 标题 + 入口」，玩法细节都在门牌页 fuyuu.top/game/。
         整张卡片就是一个链接：内部不再放第二个 <a>（a 里嵌 a 会让浏览器提前
         闭合外层链接，内容被挤到卡片外面，手机端就会文字溢出、按钮点不动）。 -->
    <a class="featured" href="./game/">
      <div class="shot">
        <img src="./cover.jpg"
             srcset="./cover-800.jpg 800w, ./cover.jpg 1600w"
             sizes="(max-width: 780px) 100vw, 620px"
             width="1600" height="900"
             alt="苔屿小岛俯视图：环形潟湖、中间一座小山，草地上散布着树林、灯塔和主角">
      </div>
      <div class="body">
        <h2>苔屿</h2>
        <span class="enter">进入小岛 <span class="arrow">→</span></span>
      </div>
    </a>
  </section>

  <section class="about" id="about" aria-labelledby="about-title">
    <div>
      <h2 id="about-title">关于</h2>
      <p>这里放我自己做的交互作品。现在只开了一座小岛，更多还在路上。</p>
    </div>
    <div>
      <p class="meta">
        <b>联系</b><a href="mailto:1649198167@qq.com">1649198167@qq.com</a>
      </p>
    </div>
  </section>

  <footer>
    <span>© 2026 fuyuu</span>
    <span><a href="./game/">fuyuu.top/game</a></span>
  </footer>

</div>
</body>
</html>
