<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fuyuu · 交互作品</title>
<meta name="description" content="fuyuu 的交互作品：可以直接在浏览器里打开的两件小东西——《苔屿》一座能钓鱼的小岛，《滚动吧！奶蛋》一片会被弹飞的帷幕。">
<meta name="theme-color" content="#f6efdd">
<meta property="og:type" content="website">
<meta property="og:title" content="fuyuu · 交互作品">
<meta property="og:description" content="fuyuu 的交互作品：可以直接在浏览器里打开的两件小东西——《苔屿》一座能钓鱼的小岛，《滚动吧！奶蛋》一片会被弹飞的帷幕。">
<meta property="og:image" content="./cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff8eb'/%3E%3Cpath d='M6 20c2-6 6-9 10-9s8 3 10 9c-3 3-6 4-10 4s-7-1-10-4z' fill='%2378b6a8'/%3E%3Ccircle cx='16' cy='15' r='3.4' fill='%235f7f6a'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #241d18;
    --ink-soft: #5a4f45;
    --paper: #f6efdd;
    --paper-lift: #fff8eb;
    --paper-deep: #ece0c6;
    --butter: #ffe27a;
    --sea: #78b6a8;
    --sea-deep: #3f7c72;
    --coral: #e08a72;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --radius: 18px;
    --shadow-ink: 3px 3px 0 rgba(36, 29, 24, .82);
    --shadow-soft: 0 12px 30px rgba(36, 29, 24, .10);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 56px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.65;
    overflow-wrap: break-word;
    background-color: var(--paper);
    background-image:
      radial-gradient(120% 80% at 12% -10%, #fffdf5 0%, rgba(255, 253, 245, 0) 55%),
      radial-gradient(90% 60% at 100% 0%, #f0f7f2 0%, rgba(240, 247, 242, 0) 60%),
      radial-gradient(70% 50% at 50% 110%, #efe3c9 0%, rgba(239, 227, 201, 0) 70%);
    background-attachment: fixed;
  }

  .wrap { width: 100%; max-width: 1060px; margin: 0 auto; }

  /* ---------- header ---------- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 34px 4px 26px;
  }

  .mark {
    font-family: var(--serif);
    font-size: clamp(30px, 5.4vw, 44px);
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1;
    margin: 0;
  }

  .mark span { color: var(--sea-deep); }

  .top nav {
    display: flex;
    gap: 18px;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--ink-soft);
  }

  .top nav a {
    color: inherit;
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
    transition: border-color .18s ease, color .18s ease;
  }

  .top nav a:hover,
  .top nav a:focus-visible { color: var(--ink); border-bottom-color: var(--ink); }

  /* ---------- hero line ---------- */
  .lede {
    font-family: var(--serif);
    font-size: clamp(19px, 2.6vw, 26px);
    line-height: 1.5;
    margin: 0 4px 34px;
    max-width: 22em;
    color: var(--ink);
  }

  .lede em { font-style: normal; background: linear-gradient(transparent 62%, var(--butter) 62%); }

  /* ---------- section label ---------- */
  .label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 4px 14px;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(36, 29, 24, .22), rgba(36, 29, 24, 0));
  }

  /* ---------- featured card ---------- */
  .featured {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 0;
    background: var(--paper-lift);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-ink);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .featured:hover,
  .featured:focus-within {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 rgba(36, 29, 24, .82);
  }

  .featured:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 4px; }

  /* 大厅里同时挂两件作品时，卡片之间留一段呼吸 */
  .featured + .featured { margin-top: 30px; }

  .shot {
    position: relative;
    background: var(--paper-deep);
    min-height: 200px;
    overflow: hidden;
  }

  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 46%;
  }

  .shot::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(36, 29, 24, .10);
    pointer-events: none;
  }

  .body { padding: 30px 30px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }

  /* 标题和地址链接同一行：链接就在标题后面，不再单独占一行 */
  .title-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 16px;
  }

  .kicker {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--sea-deep);
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .featured h2 {
    font-family: var(--serif);
    font-size: clamp(30px, 4vw, 42px);
    line-height: 1.15;
    margin: 0;
    letter-spacing: .03em;
  }

  /* 全角叹号自带右侧空隙，「吧！奶蛋」看着像多了个空格；收一点回来 */
  .bang { margin-right: -.30em; }

  .featured p {
    margin: 0;
    font-size: 14.5px;
    color: var(--ink-soft);
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .tags li {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #fffdf5;
    border: 1px solid rgba(36, 29, 24, .22);
    color: var(--ink-soft);
  }

  .update {
    margin: -10px 0 20px;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .update a { color: var(--sea-deep); }

  /* 标题后面直接写真实地址（不是「进入小岛」这种按钮文案）：
     fuyuu.top/game 就是入口地址，点它一定跳转；再用 ::after 把整张卡片铺满，
     点封面同样能进。整张卡片里只保留这一个 <a>（a 里嵌 a 会让浏览器提前闭合
     外层链接，手机端就会文字溢出、按钮点不动）。 */
  .enter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 1px 0 2px;
    color: var(--sea-deep);
    text-decoration: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    letter-spacing: .01em;
    border-bottom: 2px solid currentColor;
    transition: color .18s ease;
    word-break: break-all;
  }

  .enter::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
  }

  .enter:hover,
  .enter:focus-visible { color: var(--ink); }
  .enter:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 6px; }

  /* ---------- about ---------- */
  .about {
    margin-top: 46px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 28px;
    border-top: 1px solid rgba(36, 29, 24, .18);
    padding-top: 26px;
  }

  .about h2 {
    font-family: var(--serif);
    font-size: 21px;
    margin: 0 0 10px;
  }

  .about p {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 30em;
  }

  .about .meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 2;
    margin: 0;
  }

  /* 邮箱之类的链接跟着页面配色走，不要浏览器默认那身蓝 */
  .about .meta a { color: var(--sea-deep); }

  .about .meta b {
    display: inline-block;
    min-width: 5.2em;
    color: var(--ink);
    font-weight: 600;
  }

  .about .meta a { word-break: break-all; }

  footer {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid rgba(36, 29, 24, .18);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: rgba(90, 79, 69, .85);
  }

  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(36, 29, 24, .25); }

  @media (max-width: 780px) {
    body { padding: 0 14px 40px; }
    .top { padding: 26px 2px 20px; }
    .featured { grid-template-columns: 1fr; }
    .shot { min-height: 0; aspect-ratio: 16 / 9; }
    .body { padding: 20px 18px 20px; }
    .about { grid-template-columns: 1fr; gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .featured:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 class="mark">fuyuu<span>.</span></h1>
    <nav>
      <a href="#works">作品</a>
      <a href="#about">关于</a>
    </nav>
  </header>

  <section id="works" aria-labelledby="works-label">
    <p class="label" id="works-label">作品 / WORK</p>

    <!-- 大厅只做「封面 + 标题 + 进入链接」，玩法细节都在门牌页 fuyuu.top/game/。
         注意：卡片本身不是链接，唯一的 <a> 是标题后面那个 fuyuu.top/game，
         它用 ::after 铺满整张卡片，所以点封面也等于点链接。 -->
    <article class="featured">
      <div class="shot">
        <img src="./cover.jpg"
             srcset="./cover-800.jpg 800w, ./cover.jpg 1600w"
             sizes="(max-width: 780px) 100vw, 620px"
             width="1600" height="900"
             alt="苔屿小岛俯视图：环形潟湖、中间一座小山，草地上散布着树林、灯塔和主角">
      </div>
      <div class="body">
        <p class="kicker">01 / 钓鱼</p>
        <div class="title-row">
          <h2>苔屿</h2>
          <a class="enter" href="./game/">fuyuu.top/game</a>
        </div>
        <p>一座低多边形的小岛：抛竿钓鱼、和鱼搏斗一场「弦歌」，顺手种两行菜。</p>
      </div>
    </article>

    <article class="featured">
      <div class="shot">
        <img src="./roll/cover.jpg"
             srcset="./roll/cover-800.jpg 800w, ./roll/cover.jpg 1600w"
             sizes="(max-width: 780px) 100vw, 620px"
             width="1600" height="900" loading="lazy"
             alt="光谱点阵帷幕上，一颗发光的奶蛋站在波纹里">
      </div>
      <div class="body">
        <p class="kicker">02 / 解压</p>
        <div class="title-row">
          <h2>滚动吧<span class="bang">！</span>奶蛋</h2>
          <a class="enter" href="./roll/">fuyuu.top/roll</a>
        </div>
        <p>一片光点织成的帷幕。轻点荡开一圈，按住攒足力气，奶蛋会被波顶起来翻着跟头飞出去。</p>
        </div>
    </article>
  </section>

  <section class="about" id="about" aria-labelledby="about-title">
    <div>
      <h2 id="about-title">关于</h2>
      <p>这里放我自己做的交互作品。现在开了两件：一座小岛，一颗奶蛋；更多还在路上。</p>
    </div>
    <div>
      <p class="meta">
        <b>联系</b><a href="mailto:1649198167@qq.com">1649198167@qq.com</a>
      </p>
    </div>
  </section>

  <footer>
    <span>© 2026 fuyuu</span>
    <span><a href="./game/">fuyuu.top/game</a> · <a href="./roll/">fuyuu.top/roll</a></span>
  </footer>

</div>
</body>
</html>
