<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滚动吧！奶蛋</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://roll.fuyuu.top/">
<meta http-equiv="refresh" content="0; url=https://roll.fuyuu.top/">
<!-- 这里原来放着游戏本体的第二份副本（2.35 MB）。现在游戏只维护一份，放在
     Cloudflare Pages（roll.fuyuu.top），这个地址只负责把老链接送过去。 -->
<style>
  :root {
    --paper: #f6efdd;
    --ink: #241d18;
    --sea: #3f7c72;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.7 "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
    padding: 24px;
    text-align: center;
  }
  p { margin: 0; }
  .hint { font-size: 13px; opacity: .62; margin-top: 10px; }
  a {
    color: var(--sea);
    text-decoration: none;
    border-bottom: 2px solid currentColor;
    padding-bottom: 1px;
  }
</style>
</head>
<body>
  <p>正在前往 <a href="https://roll.fuyuu.top/">roll.fuyuu.top</a>…</p>
  <p class="hint">没反应就点上面的链接</p>
  <script>
    location.replace("https://roll.fuyuu.top/" + location.hash);
  </script>
</body>
</html>
