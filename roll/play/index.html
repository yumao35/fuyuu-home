<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Spectral Curtain</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #080706;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app { position: fixed; inset: 0; }
  #app canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: default;
  }
  /* 拖动镜头时给一点「抓起来了」的反馈 */
  body.panning #app canvas { cursor: grabbing; }

  /* ---------- 右上角的画布入口 ---------- */
  #dock {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 20;
  }

  #brush {
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(238, 226, 200, 0.28);
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 236, 198, 0.16), rgba(255, 236, 198, 0) 70%),
      rgba(12, 14, 16, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    box-shadow: 0 0 0 rgba(255, 226, 170, 0);
  }
  /* 图标：一支斜着的小笔尖，不用文字 */
  #brush::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 15px;
    margin: -7.5px 0 0 -1px;
    border-radius: 2px;
    background: linear-gradient(to bottom, rgba(255, 244, 220, 0.95), rgba(255, 228, 176, 0.35));
    transform: rotate(38deg);
    transform-origin: 50% 50%;
  }
  #brush::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin: 3px 0 0 -2.5px;
    border-radius: 50%;
    background: rgba(255, 226, 170, 0.75);
  }
  #brush:hover { border-color: rgba(238, 226, 200, 0.5); }
  #brush.on {
    border-color: rgba(255, 232, 190, 0.62);
    box-shadow: 0 0 22px rgba(255, 214, 150, 0.28);
    transform: scale(0.96);
  }

  /* ---------- 左上角的操作说明 ---------- */
  #helpDock {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #helpBtn,
  #sfxBtn {
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(238, 226, 200, 0.24);
    background: rgba(12, 14, 16, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(244, 233, 210, 0.72);
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s, background 0.3s, opacity 0.3s;
  }
  #helpBtn {
    font: 500 17px/1 Georgia, "Songti SC", serif;
  }
  #sfxBtn {
    position: relative;
    display: grid;
    place-items: center;
  }
  /* 喇叭：一枚三角 + 两道弧，纯 CSS 画，不出现文字 */
  #sfxBtn i {
    position: relative;
    width: 13px;
    height: 11px;
    border-radius: 1.5px 0 0 1.5px;
    background: currentColor;
    clip-path: polygon(0 32%, 42% 32%, 100% 0, 100% 100%, 42% 68%, 0 68%);
  }
  #sfxBtn::before {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1.4px solid currentColor;
    border-left-color: transparent;
    border-top-color: transparent;
    border-bottom-color: transparent;
    opacity: 0.55;
    transform: translate(7px, 0) scale(0.62);
    transition: opacity 0.3s;
  }
  #sfxBtn.off::before { opacity: 0; }
  #sfxBtn.off { color: rgba(244, 233, 210, 0.40); }
  #helpBtn:hover,
  #sfxBtn:hover { border-color: rgba(238, 226, 200, 0.46); color: rgba(252, 244, 226, 0.95); }
  #sfxBtn:active { transform: scale(0.96); }
  #helpBtn[aria-expanded="true"] {
    border-color: rgba(255, 232, 190, 0.55);
    color: rgba(255, 244, 220, 0.96);
    background: rgba(28, 24, 18, 0.72);
  }

  #helpPanel {
    position: fixed;
    top: 70px;
    left: 24px;
    z-index: 20;
    width: 300px;
    max-width: calc(100vw - 48px);
    padding: 15px 17px 14px;
    border-radius: 14px;
    border: 1px solid rgba(236, 224, 198, 0.16);
    background: rgba(11, 13, 15, 0.66);
    backdrop-filter: blur(14px) saturate(115%);
    -webkit-backdrop-filter: blur(14px) saturate(115%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 244, 220, 0.06);
    color: rgba(238, 230, 213, 0.82);
    font: 400 12.5px/1.9 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #helpPanel[hidden] { display: none; }
  #helpPanel p { margin: 0; display: flex; gap: 10px; }
  #helpPanel p + p { margin-top: 4px; }
  #helpPanel span {
    flex: 0 0 3.4em;
    color: rgba(255, 232, 190, 0.62);
    letter-spacing: 0.04em;
  }
  /* 电脑只讲鼠标，手机只讲手指（媒体查询兜底，JS 再按实际触点数补一刀） */
  @media (hover: hover) and (pointer: fine) {
    #helpPanel .m-touch { display: none; }
  }
  @media (hover: none), (pointer: coarse) {
    #helpPanel .m-mouse { display: none; }
    #helpPanel { width: 320px; }
  }
  html.is-desk #helpPanel .m-touch { display: none; }
  html.is-touch #helpPanel .m-mouse { display: none; }
  html.is-touch #helpPanel { width: 320px; }

  /* ---------- 画布卡片 ---------- */
  #card {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 21;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    border: 1px solid rgba(236, 224, 198, 0.16);
    background: rgba(11, 13, 15, 0.62);
    backdrop-filter: blur(14px) saturate(115%);
    -webkit-backdrop-filter: blur(14px) saturate(115%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 244, 220, 0.06);
    overflow: hidden;
    touch-action: none;
  }
  #card[hidden] { display: none; }

  #cardGrip {
    height: 22px;
    flex: 0 0 22px;
    cursor: grab;
    position: relative;
    background: linear-gradient(to bottom, rgba(255, 244, 220, 0.05), rgba(255, 244, 220, 0));
  }
  #cardGrip::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 9px;
    width: 30px;
    height: 2px;
    margin-left: -15px;
    border-radius: 2px;
    background: rgba(240, 230, 210, 0.22);
  }
  #cardGrip:active { cursor: grabbing; }

  #pad {
    flex: 1 1 auto;
    width: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* 四边中点的伸缩抓手（拖哪边往哪边伸） */
  #card .rz { position: absolute; z-index: 3; touch-action: none; }
  #card .rz[data-edge="l"], #card .rz[data-edge="r"] {
    top: 22px;
    bottom: 0;
    width: 13px;
    cursor: ew-resize;
  }
  #card .rz[data-edge="l"] { left: -2px; }
  #card .rz[data-edge="r"] { right: -2px; }
  #card .rz[data-edge="t"], #card .rz[data-edge="b"] {
    left: 13px;
    right: 13px;
    height: 13px;
    cursor: ns-resize;
  }
  #card .rz[data-edge="t"] { top: -2px; }
  #card .rz[data-edge="b"] { bottom: -2px; }
  #card .rz:hover { background: rgba(240, 228, 200, 0.07); }

  /* 跟着指针飘的那一笔 */
  #ghost {
    position: fixed;
    left: 0;
    top: 0;
    width: 170px;
    height: 170px;
    margin: -85px 0 0 -85px;
    pointer-events: none;
    z-index: 19;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="dock"><button id="brush" aria-label="画布"></button></div>

<div id="helpDock">
  <button id="helpBtn" aria-label="操作说明" aria-expanded="false">?</button>
  <button id="sfxBtn" aria-label="声音开关" aria-pressed="true"><i></i></button>
  <div id="helpPanel" hidden>
    <p class="m-mouse"><span>鼠标</span>左键点一下 / 按住 / 拖动：产生波纹（按得越久越大）</p>
    <p class="m-mouse"><span>视角</span>中键上下拖：往下拖升空、往上拖落回；左右拖：画面横移</p>
    <p class="m-touch"><span>手指</span>单指点一下 / 按住 / 拖动：产生波纹（按得越久越大）</p>
    <p class="m-touch"><span>视角</span>双指上下拖：升降（往下拖升空、往上拖落回）；双指左右拖：画面横移</p>
    <p><span>画笔</span>右上角画一笔，拖到帷幕上松手</p>
  </div>
</div>

<div id="card" hidden>
  <div class="rz" data-edge="t"></div>
  <div class="rz" data-edge="l"></div>
  <div class="rz" data-edge="r"></div>
  <div class="rz" data-edge="b"></div>
  <div id="cardGrip"></div>
  <canvas id="pad"></canvas>
</div>

</body>
</html>
