<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Spectral Curtain</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #080706;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app { position: fixed; inset: 0; }

  /* 等 app.js 的那几秒：只给一点呼吸的光，别让人对着黑屏 */
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 42%, #141a22 0%, #080706 62%);
    z-index: 5;
    transition: opacity .7s ease;
  }
  #boot i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffd9a8;
    box-shadow: 0 0 18px 6px rgba(255, 210, 150, .18);
    animation: bootBreathe 1.9s ease-in-out infinite;
  }
  @keyframes bootBreathe {
    0%, 100% { opacity: .18; transform: scale(.86); }
    50% { opacity: .85; transform: scale(1); }
  }
  html.booted #boot { opacity: 0; visibility: hidden; }

  #app canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: default;
  }
  /* 拖动镜头时给一点「抓起来了」的反馈 */
  body.panning #app canvas { cursor: grabbing; }

  /* ---------- 右上角的画布入口 ---------- */
  #dock {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 20;
  }

  #brush {
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(238, 226, 200, 0.28);
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 236, 198, 0.16), rgba(255, 236, 198, 0) 70%),
      rgba(12, 14, 16, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    box-shadow: 0 0 0 rgba(255, 226, 170, 0);
  }
  /* 图标：一支斜着的小笔尖，不用文字 */
  #brush::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 15px;
    margin: -7.5px 0 0 -1px;
    border-radius: 2px;
    background: linear-gradient(to bottom, rgba(255, 244, 220, 0.95), rgba(255, 228, 176, 0.35));
    transform: rotate(38deg);
    transform-origin: 50% 50%;
  }
  #brush::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin: 3px 0 0 -2.5px;
    border-radius: 50%;
    background: rgba(255, 226, 170, 0.75);
  }
  #brush:hover { border-color: rgba(238, 226, 200, 0.5); }
  #brush.on {
    border-color: rgba(255, 232, 190, 0.62);
    box-shadow: 0 0 22px rgba(255, 214, 150, 0.28);
    transform: scale(0.96);
  }

  /* ---------- 左上角的操作说明 ---------- */
  #helpDock {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #helpBtn,
  #sfxBtn {
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(238, 226, 200, 0.24);
    background: rgba(12, 14, 16, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(244, 233, 210, 0.72);
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s, background 0.3s, opacity 0.3s;
  }
  #helpBtn {
    font: 500 17px/1 Georgia, "Songti SC", serif;
  }
  #sfxBtn {
    position: relative;
    display: grid;
    place-items: center;
  }
  /* 喇叭：一枚三角 + 两道弧，纯 CSS 画，不出现文字 */
  #sfxBtn i {
    position: relative;
    width: 13px;
    height: 11px;
    border-radius: 1.5px 0 0 1.5px;
    background: currentColor;
    clip-path: polygon(0 32%, 42% 32%, 100% 0, 100% 100%, 42% 68%, 0 68%);
  }
  #sfxBtn::before {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1.4px solid currentColor;
    border-left-color: transparent;
    border-top-color: transparent;
    border-bottom-color: transparent;
    opacity: 0.55;
    transform: translate(7px, 0) scale(0.62);
    transition: opacity 0.3s;
  }
  #sfxBtn.off::before { opacity: 0; }
  #sfxBtn.off { color: rgba(244, 233, 210, 0.40); }
  #helpBtn:hover,
  #sfxBtn:hover { border-color: rgba(238, 226, 200, 0.46); color: rgba(252, 244, 226, 0.95); }
  #sfxBtn:active { transform: scale(0.96); }
  #helpBtn[aria-expanded="true"] {
    border-color: rgba(255, 232, 190, 0.55);
    color: rgba(255, 244, 220, 0.96);
    background: rgba(28, 24, 18, 0.72);
  }

  #helpPanel {
    position: fixed;
    top: 70px;
    left: 24px;
    z-index: 20;
    width: 300px;
    max-width: calc(100vw - 48px);
    padding: 15px 17px 14px;
    border-radius: 14px;
    border: 1px solid rgba(236, 224, 198, 0.16);
    background: rgba(11, 13, 15, 0.66);
    backdrop-filter: blur(14px) saturate(115%);
    -webkit-backdrop-filter: blur(14px) saturate(115%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 244, 220, 0.06);
    color: rgba(238, 230, 213, 0.82);
    font: 400 12.5px/1.9 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #helpPanel[hidden] { display: none; }
  #helpPanel p { margin: 0; display: flex; gap: 10px; }
  #helpPanel p + p { margin-top: 4px; }
  #helpPanel span {
    flex: 0 0 3.4em;
    color: rgba(255, 232, 190, 0.62);
    letter-spacing: 0.04em;
  }
  /* 电脑只讲鼠标，手机只讲手指（媒体查询兜底，JS 再按实际触点数补一刀） */
  @media (hover: hover) and (pointer: fine) {
    #helpPanel .m-touch { display: none; }
  }
  @media (hover: none), (pointer: coarse) {
    #helpPanel .m-mouse { display: none; }
    #helpPanel { width: 320px; }
  }
  html.is-desk #helpPanel .m-touch { display: none; }
  html.is-touch #helpPanel .m-mouse { display: none; }
  html.is-touch #helpPanel { width: 320px; }

  /* ---------- 画布卡片 ---------- */
  #card {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 21;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    border: 1px solid rgba(236, 224, 198, 0.16);
    background: rgba(11, 13, 15, 0.62);
    backdrop-filter: blur(14px) saturate(115%);
    -webkit-backdrop-filter: blur(14px) saturate(115%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 244, 220, 0.06);
    overflow: hidden;
    touch-action: none;
  }
  #card[hidden] { display: none; }

  #cardGrip {
    height: 22px;
    flex: 0 0 22px;
    cursor: grab;
    position: relative;
    background: linear-gradient(to bottom, rgba(255, 244, 220, 0.05), rgba(255, 244, 220, 0));
  }
  #cardGrip::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 9px;
    width: 30px;
    height: 2px;
    margin-left: -15px;
    border-radius: 2px;
    background: rgba(240, 230, 210, 0.22);
  }
  #cardGrip:active { cursor: grabbing; }

  #pad {
    flex: 1 1 auto;
    width: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* 四边中点的伸缩抓手（拖哪边往哪边伸） */
  #card .rz { position: absolute; z-index: 3; touch-action: none; }
  #card .rz[data-edge="l"], #card .rz[data-edge="r"] {
    top: 22px;
    bottom: 0;
    width: 13px;
    cursor: ew-resize;
  }
  #card .rz[data-edge="l"] { left: -2px; }
  #card .rz[data-edge="r"] { right: -2px; }
  #card .rz[data-edge="t"], #card .rz[data-edge="b"] {
    left: 13px;
    right: 13px;
    height: 13px;
    cursor: ns-resize;
  }
  #card .rz[data-edge="t"] { top: -2px; }
  #card .rz[data-edge="b"] { bottom: -2px; }
  #card .rz:hover { background: rgba(240, 228, 200, 0.07); }

  /* 跟着指针飘的那一笔 */
  #ghost {
    position: fixed;
    left: 0;
    top: 0;
    width: 170px;
    height: 170px;
    margin: -85px 0 0 -85px;
    pointer-events: none;
    z-index: 19;
    opacity: 0.9;
  }
</style>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<script>
(function () {
  var local = /[?&]local=1/.test(location.search);
  var src = local ? './app.js' : "https://cdn.jsdelivr.net/gh/yumao35/fuyuu-home@523c61f0fd74530c7871f3ec736a23bb42c1ceff/roll/play/app.js";
  var model = local ? './naidan.glb' : "https://cdn.jsdelivr.net/gh/yumao35/fuyuu-home@523c61f0fd74530c7871f3ec736a23bb42c1ceff/roll/play/naidan.glb";
  window.__MODEL_URI = model;
  var s = document.createElement('script');
  s.src = src;
  s.onerror = function () {
    if (local) return;
    window.__MODEL_URI = './naidan.glb';
    var t = document.createElement('script');
    t.src = './app.js';
    document.head.appendChild(t);
  };
  document.head.appendChild(s);

  setTimeout(function () {
    if (window.__curtain) return;
    var boot = document.getElementById('boot');
    if (!boot) return;
    var hint = document.createElement('a');
    hint.id = 'bootHint';
    hint.href = '?local=1';
    hint.textContent = '加载有点慢？点这里换条线路';
    hint.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font:13px/1.6 system-ui;color:rgba(255,232,190,.55);text-decoration:none;letter-spacing:.02em;z-index:2;';
    boot.appendChild(hint);
    hint.addEventListener('click', function (e) {
      e.preventDefault();
      location.search = '?local=1';
    });
  }, 15000);
})();
</script>
<style>
  #boot canvas { width: 100%; height: 100%; display: block; animation: preBreathe 2.6s ease-in-out infinite alternate; }
  @keyframes preBreathe { from { opacity: .70; } to { opacity: 1; } }
  #boot i { display: none; }
</style>
<script>/* 首屏：three 还没到的时候，先用 Canvas 2D 画一张"像那么回事"的点阵心形帷幕。
   只画一次（静态图），呼吸感交给 CSS 动画，省得每帧重绘上万个点。
   只有网页版（壳）会内联这段；单文件版不需要。
   第一帧真正画面出来时，index.html 会给 <html> 加 .booted，这块随之淡出并移除。 */
(function () {
  function start() {
    var boot = document.getElementById('boot');
    if (!boot) return;
    var c = document.createElement('canvas');
    c.id = 'pre';
    c.setAttribute('aria-hidden', 'true');
    boot.appendChild(c);

    var ctx = c.getContext('2d');

    /* 心形参数曲线，归一化到 x∈[-0.95,0.95]、y∈[-1,0.70] */
    var HB = [];
    (function buildHeart() {
      var N = 480, minY = 1e9, maxY = -1e9;
      for (var i = 0; i < N; i++) {
        var t = (i / N) * Math.PI * 2;
        var hx = 16 * Math.pow(Math.sin(t), 3);
        var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        HB.push([hx / 17, hy / 17]);
        if (hy / 17 < minY) minY = hy / 17;
        if (hy / 17 > maxY) maxY = hy / 17;
      }
      HB.minY = minY;
      HB.maxY = maxY;
    })();

    function hash(x, y) {
      var n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return n - Math.floor(n);
    }

    // 扫描线：横向切一条线，返回与心形边界的交点（成对出现＝一段有效区间）
    function crossingsAt(y) {
      var xs = [];
      for (var i = 0; i < HB.length; i++) {
        var a = HB[i], b = HB[(i + 1) % HB.length];
        if ((a[1] <= y) !== (b[1] <= y)) {
          var k = (y - a[1]) / ((b[1] - a[1]) || 1e-6);
          xs.push(a[0] + (b[0] - a[0]) * k);
        }
      }
      xs.sort(function (p, q) { return p - q; });
      return xs;
    }

    function render() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var W = c.clientWidth || window.innerWidth;
      var H = c.clientHeight || window.innerHeight;
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      var cx = W * 0.5;
      var top = H * 0.455;
      var bot = H * 1.28;
      var maxHalf = W * 0.455;

      // 地平线一层暖光，和正式画面接得上
      var g = ctx.createLinearGradient(0, top - H * 0.16, 0, top + H * 0.16);
      g.addColorStop(0, 'rgba(255,205,150,0)');
      g.addColorStop(0.55, 'rgba(255,205,150,0.05)');
      g.addColorStop(1, 'rgba(255,205,150,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, top - H * 0.16, W, H * 0.32);

      var rows = Math.max(80, Math.round((bot - top) / 2.4));
      var stepPx = 3.0;
      for (var r = 0; r < rows; r++) {
        var v = r / (rows - 1);                     // 0 上（两瓣）/ 1 下（尖）
        var yh = HB.maxY - v * (HB.maxY - HB.minY);
        var xs = crossingsAt(yh);
        var sy = top + Math.pow(v, 1.36) * (bot - top);
        var hw = maxHalf * (0.24 + 0.76 * Math.pow(v, 0.85));
        for (var s = 0; s < xs.length; s += 2) {
          var xa = xs[s], xb = xs[s + 1];
          if (xb === undefined || xb - xa < 0.01) continue;
          var sxA = cx + (xa / 0.95) * hw;
          var sxB = cx + (xb / 0.95) * hw;
          var cols = Math.max(1, Math.round((sxB - sxA) / stepPx));
          for (var j = 0; j <= cols; j++) {
            if ((j + r) % 2) continue;              // 隔行错半格
            var f = j / cols;
            var xh = xa + f * (xb - xa);
            var wave = Math.sin(xh * 3.1 + v * 6.0) * 0.5 + Math.sin(xh * 7.3 - v * 3.4) * 0.28;
            var crest = 0.36 + 0.34 * Math.max(0, wave) + 0.10 * (1 - v);
            var warm = Math.max(0, Math.min(1, crest * 1.55 - 0.12));
            var rc = Math.round(124 + warm * 128);
            var gc = Math.round(130 + warm * 112);
            var bc = Math.round(140 + warm * 62);
            var jit1 = hash(j * 1.7, r * 3.3);
            var jit2 = hash(j * 5.1, r * 9.7);
            var alpha = Math.min(1, (0.38 + crest * 0.62) * (0.78 + 0.42 * jit2));
            ctx.fillStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',' + alpha.toFixed(3) + ')';
            var sx = sxA + f * (sxB - sxA);
            ctx.fillRect(sx + (jit1 - 0.5) * 1.4, sy + (jit2 - 0.5) * 2.2, 1.7, 1.7);
          }
        }
      }
    }

    render();
    window.addEventListener('resize', render);

    // 正式画面出来就把自己收掉
    var obs = new MutationObserver(function () {
      if (document.documentElement.classList.contains('booted')) {
        obs.disconnect();
        setTimeout(function () { c.remove(); }, 900);
      }
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  }

  /* 不能用 DOMContentLoaded 等：defer 的 app.js 慢的时候会把它一起拖住。 */
  if (document.getElementById('boot')) {
    start();
  } else {
    var tries = 0;
    var timer = setInterval(function () {
      if (document.getElementById('boot')) {
        clearInterval(timer);
        start();
      } else if (++tries > 400) {
        clearInterval(timer);
      }
    }, 16);
  }
})();
</script>
</head>
<body>
<div id="app"></div>
<div id="boot"><i></i></div>

<div id="dock"><button id="brush" aria-label="画布"></button></div>

<div id="helpDock">
  <button id="helpBtn" aria-label="操作说明" aria-expanded="false">?</button>
  <button id="sfxBtn" aria-label="声音开关" aria-pressed="true"><i></i></button>
  <div id="helpPanel" hidden>
    <p class="m-mouse"><span>鼠标</span>左键点一下 / 按住 / 拖动：产生波纹（按得越久越大）</p>
    <p class="m-mouse"><span>视角</span>中键上下拖：往下拖升空、往上拖落回；左右拖：画面横移</p>
    <p class="m-touch"><span>手指</span>单指点一下 / 按住 / 拖动：产生波纹（按得越久越大）</p>
    <p class="m-touch"><span>视角</span>双指上下拖：升降（往下拖升空、往上拖落回）；双指左右拖：画面横移</p>
    <p><span>画笔</span>右上角画一笔，拖到帷幕上松手</p>
  </div>
</div>

<div id="card" hidden>
  <div class="rz" data-edge="t"></div>
  <div class="rz" data-edge="l"></div>
  <div class="rz" data-edge="r"></div>
  <div class="rz" data-edge="b"></div>
  <div id="cardGrip"></div>
  <canvas id="pad"></canvas>
</div>

<script>
/* app.js 由 head 里的 defer 脚本加载，这里什么都不做 */
</script>
</body>
</html>
