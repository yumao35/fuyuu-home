<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>滚动吧！奶蛋</title>
<meta http-equiv="refresh" content="0; url=https://game.fuyuu.top/naidan/" />
<link rel="canonical" href="https://game.fuyuu.top/naidan/" />
<style>
  html, body { margin: 0; height: 100%; background: #080706; }
  body {
    display: grid;
    place-items: center;
    font: 400 14px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: rgba(255, 232, 190, .62);
  }
  a { color: rgba(255, 232, 190, .88); text-decoration: none; border-bottom: 1px solid rgba(255, 232, 190, .28); }
  .dot {
    width: 7px; height: 7px; margin: 0 auto 14px; border-radius: 50%;
    background: #ffd9a8; box-shadow: 0 0 18px 6px rgba(255, 210, 150, .18);
    animation: breathe 1.9s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.85) } 50% { opacity: 1; transform: scale(1) } }
  p { text-align: center; margin: 0 }
</style>
</head>
<body>
  <div>
    <div class="dot"></div>
    <p>正在去新的地址 · <a id="go" href="https://game.fuyuu.top/naidan/">game.fuyuu.top/naidan</a></p>
  </div>
<script>
  location.replace("https://game.fuyuu.top/naidan/" + location.hash);
  document.getElementById("go").addEventListener("click", function (e) {
    e.preventDefault();
    location.href = "https://game.fuyuu.top/naidan/" + location.hash;
  });
</script>
</body>
</html>
